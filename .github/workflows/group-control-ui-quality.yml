name: Group Control Kitchen UI quality

on:
  pull_request:
    paths:
      - "src/pages/ActionCentre.tsx"
      - "src/components/portfolio-ui/**"
      - ".github/workflows/group-control-ui-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/ActionCentre.tsx"
      - "src/components/portfolio-ui/**"
      - ".github/workflows/group-control-ui-quality.yml"

permissions:
  contents: read

jobs:
  web-ui:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            command: npx tsc --noEmit -p tsconfig.app.json
          - name: lint
            command: npm run lint
          - name: unit-tests
            command: npm run test
          - name: production-build
            command: npm run build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pinned v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
